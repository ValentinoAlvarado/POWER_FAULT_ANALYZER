name: Windows desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PFA_RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: x64
          cache: pip

      - name: Acquire pinned QElectroTech symbol assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # This is a PowerShell script, not a native executable. Its terminating
          # errors propagate directly; LASTEXITCODE is undefined/null here.
          ./scripts/Acquire-QElectroTechSymbolSeed.ps1

      - name: Install Cairo native runtime
        uses: msys2/setup-msys2@v2
        id: cairo
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-cairo

      - name: Configure Cairo DLL discovery
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.cairo.outputs.msys2-location }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MSYS2_LOCATION)) { throw "MSYS2 location was not provided." }
          $cairoBin = Join-Path $env:MSYS2_LOCATION "ucrt64\bin"
          $cairoDll = Join-Path $cairoBin "libcairo-2.dll"
          if (-not (Test-Path -LiteralPath $cairoDll)) { throw "Cairo DLL missing: $cairoDll" }
          "CAIROCFFI_DLL_DIRECTORIES=$cairoBin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $cairoBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build, test and package portable Windows application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The build script checks every native tool it invokes and throws on
          # failure. Do not inspect LASTEXITCODE after invoking a .ps1 script.
          ./scripts/build_windows_release.ps1

      - name: Require reviewed licenses for packages without metadata
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          python scripts/verify_release_license_review.py `
            --inventory dist/release/PYTHON-DEPENDENCY-LICENSES.md `
            --review RELEASE_LICENSE_REVIEW.csv
          if ($LASTEXITCODE -ne 0) { throw "Third-party license review failed; release blocked." }

      - name: Verify release artifacts
        shell: pwsh
        run: |
          $required = @(
            "dist/release/PFA-Windows-x64.zip",
            "dist/release/SHA256SUMS.txt",
            "dist/release/SBOM.cdx.json",
            "dist/release/PYTHON-DEPENDENCY-LICENSES.md",
            "dist/release/THIRD_PARTY_NOTICES.md",
            "dist/release/BUILD-INFO.json"
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Required release artifact missing: $file" }
            if ((Get-Item -LiteralPath $file).Length -le 0) { throw "Release artifact is empty: $file" }
          }
          foreach ($line in Get-Content "dist/release/SHA256SUMS.txt") {
            if ($line -notmatch '^([a-fA-F0-9]{64})\s+(.+)$') { throw "Invalid checksum row: $line" }
            $expected = $Matches[1].ToLowerInvariant()
            $target = Join-Path "dist/release" $Matches[2].Trim()
            if (-not (Test-Path -LiteralPath $target -PathType Leaf)) { throw "Checksum target missing: $target" }
            $actual = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "SHA-256 mismatch: $target" }
          }

      - name: Upload portable release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: POWER-FAULT-ANALYZER-Windows-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            dist/release/PFA-Windows-x64.zip
            dist/release/SHA256SUMS.txt
            dist/release/SBOM.cdx.json
            dist/release/PYTHON-DEPENDENCY-LICENSES.md
            dist/release/THIRD_PARTY_NOTICES.md
            dist/release/BUILD-INFO.json

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: POWER_FAULT_ANALYZER ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/release/PFA-Windows-x64.zip
            dist/release/SHA256SUMS.txt
            dist/release/SBOM.cdx.json
            dist/release/PYTHON-DEPENDENCY-LICENSES.md
            dist/release/THIRD_PARTY_NOTICES.md
            dist/release/BUILD-INFO.json