[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "power-fault-analyzer"
authors = [{ name = "Valentino Alvarado" }]
license-files = ["LICENSE", "LICENSES/*"]
license = "GPL-3.0-or-later"
readme = "README.md"
version = "0.1.0b2"
description = "Open-source power-system engineering workbench and short-circuit analysis platform"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.2,<3",
    "scipy>=1.15,<2",
    "networkx>=3.4,<4",
    "pandas>=2.2,<4",
    "pydantic>=2.10,<3",
    "pint>=0.24,<1",
    "packaging>=24,<27",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Framework :: PySide",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "hypothesis>=6.120,<7",
    "ruff>=0.9,<1",
    "pytest-qt>=4.4,<5",
]
notebook = ["jupyterlab>=4.3,<5", "ipykernel>=6.29,<7"]
desktop = ["PySide6>=6.8,<7", "matplotlib>=3.10,<4", "pyqtgraph>=0.13,<1", "QtAwesome>=1.3,<2", "CairoSVG>=2.7,<3"]
cad = ["ezdxf>=1.4,<2"]
visualization3d = ["pyvista>=0.44,<1", "trimesh>=4.5,<5"]
reports = ["openpyxl>=3.1,<4", "reportlab>=4.2,<5"]
release = ["pyinstaller>=6.11,<7"]
api = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
pfa-validate = "power_fault_analyzer.validation.cli:main"
pfa = "power_fault_analyzer.interfaces.cli.main:main"
pfa-desktop = "power_fault_analyzer.interfaces.desktop.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["POWER_FAULT_ANALYZER.ipynb"]

[tool.setuptools.package-data]
power_fault_analyzer = ["py.typed", "validation/data/*.json"]
